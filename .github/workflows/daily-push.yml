name: Daily Health Push

on:
  schedule:
    # 08:00 Asia/Taipei = 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force push even if already sent today'
        required: false
        default: 'false'

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run daily push
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_TARGET_CHAT_ID: ${{ secrets.LINE_TARGET_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TEXT_MODEL: gpt-4o-mini
          OPENAI_IMAGE_MODEL: gpt-image-2
          OPENAI_IMAGE_QUALITY: medium
          OPENAI_FULL_INFOGRAPHIC: 'true'
          REQUIRE_OPENAI_IMAGE: 'true'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: line-images
          MOCK_MODE: 'false'
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="--force"
          fi
          node scripts/daily-push.js $ARGS
